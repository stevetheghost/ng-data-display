<header>
  <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Stat tiles</h1>
  <p class="mt-2 max-w-2xl text-slate-600">
    <code class="rounded bg-slate-100 px-1.5 py-0.5 text-sm">&lt;app-stat-tile&gt;</code> renders one
    headline number with an optional period-over-period delta. Set
    <code class="rounded bg-slate-100 px-1.5 py-0.5 text-sm">lowerIsBetter</code> on the stat to flip
    which direction reads as good — latency and error rate use it below.
  </p>
</header>

<section aria-labelledby="fleet-heading" class="mt-8">
  <h2 id="fleet-heading" class="sr-only">Fleet totals</h2>
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (stat of stats(); track stat.label) {
      <app-stat-tile [stat]="stat" />
    }
  </div>
</section>
